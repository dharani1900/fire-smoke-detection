services:
  - type: web
    name: chemcabinet-ai-backend
    env: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
